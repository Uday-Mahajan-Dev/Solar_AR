<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>SolarAR</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.153.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.153.0/examples/jsm/",
        "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
      }
    }
  </script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: #000;
    }
    /* Keep opacity: 1 so Chromium never throttles MindAR's video frame reader */
    #ar-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }
    #ar-container video {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }
    #ar-container canvas {
      display: none !important;
    }
    /* 2D Canvas renders the live camera feed reliably on every frame */
    #camera-feed {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      display: block;
      pointer-events: none;
    }
    /* mix-blend-mode: screen makes all (0,0,0) black pixels from Unity 100% see-through */
    #unity-canvas {
      position: fixed;
      inset: 0;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 2;
      background: transparent !important;
      mix-blend-mode: screen;
      pointer-events: auto;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(10, 12, 20, 0.92);
      color: #fff;
      font-family: system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <div id="ar-container"></div>
  <canvas id="camera-feed"></canvas>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading-overlay">
    <div id="loading-text">Loading WebAR Solar System... 0%</div>
  </div>

  <script src="Build/SolarAR3.loader.js"></script>
  <script type="module">
    import { MindARThree } from 'mindar-image-three';

    const canvas = document.querySelector('#unity-canvas');
    const camCanvas = document.querySelector('#camera-feed');
    const camCtx = camCanvas.getContext('2d');
    const loadingOverlay = document.querySelector('#loading-overlay');
    const loadingText = document.querySelector('#loading-text');

    const RECEIVER = 'MindARManager';
    const log = (...args) => console.log('[SolarAR-v4]', ...args);

    const config = {
      dataUrl: "Build/SolarAR3.data.unityweb",
      frameworkUrl: "Build/SolarAR3.framework.js.unityweb",
      codeUrl: "Build/SolarAR3.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "SolarAR",
      productVersion: "0.1.0",
    };

    function drawCameraCover(video) {
      if (!video || video.readyState < 2 || video.videoWidth === 0) return;
      const cw = window.innerWidth;
      const ch = window.innerHeight;
      if (camCanvas.width !== cw || camCanvas.height !== ch) {
        camCanvas.width = cw;
        camCanvas.height = ch;
      }
      const vw = video.videoWidth;
      const vh = video.videoHeight;
      const scale = Math.max(cw / vw, ch / vh);
      const dw = vw * scale;
      const dh = vh * scale;
      camCtx.drawImage(video, (cw - dw) * 0.5, (ch - dh) * 0.5, dw, dh);
    }

    async function startAR(unityInstance) {
      const mindarThree = new MindARThree({
        container: document.querySelector('#ar-container'),
        imageTargetSrc: './targets.mind',
        uiLoading: "no",
        uiScanning: "no",
        uiError: "no"
      });

      const { renderer, camera } = mindarThree;
      const anchor = mindarThree.addAnchor(0);
      let isTracking = false;
      let lastPose = '';

      anchor.onTargetFound = () => {
        isTracking = true;
        log('TARGET FOUND! Sending pose to Unity...');
        unityInstance.SendMessage(RECEIVER, 'OnTargetFound', '');
      };

      anchor.onTargetLost = () => {
        isTracking = false;
        lastPose = '';
        log('TARGET LOST');
        unityInstance.SendMessage(RECEIVER, 'OnTargetLost', '');
      };

      await mindarThree.start();
      const video = document.querySelector('#ar-container video');
      log('Camera active:', video ? `${video.videoWidth}x${video.videoHeight}` : 'missing');

      renderer.setAnimationLoop(() => {
        drawCameraCover(video);
        if (!isTracking || !anchor.group.visible) return;
        anchor.group.updateMatrixWorld();
        const e = anchor.group.matrixWorld.elements;
        let pose = '';
        for (let i = 0; i < 16; i++) pose += e[i].toPrecision(7) + ',';
        pose += camera.fov.toPrecision(6);
        if (pose === lastPose) return;
        lastPose = pose;
        unityInstance.SendMessage(RECEIVER, 'UpdateTargetPose', pose);
      });
    }

    createUnityInstance(canvas, config, (progress) => {
      loadingText.textContent = `Loading WebAR Solar System... ${Math.round(progress * 100)}%`;
    }).then(async (unityInstance) => {
      log('Unity instance ready');
      loadingText.textContent = 'Starting camera...';
      await startAR(unityInstance);
      loadingOverlay.style.display = 'none';
    }).catch((err) => {
      console.error('[SolarAR-v4]', err);
      loadingText.textContent = "Error: " + err;
    });
  </script>
</body>
</html>
