<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SolarAR</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.153.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.153.0/examples/jsm/",
        "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
      }
    }
  </script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: #000;
    }
    /* Direct hardware video layer — zero 2D canvas copying */
    #ar-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }
    #ar-container video {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      z-index: 1 !important;
    }
    /* Tiny 1x1 canvas keeps MindAR's vision worker alive with near-zero GPU cost */
    #ar-container canvas {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      opacity: 0.01 !important;
      pointer-events: none !important;
    }
    /* True alpha-transparent Unity canvas — no expensive mix-blend-mode */
    #unity-canvas {
      position: fixed;
      inset: 0;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 2;
      background: transparent !important;
      pointer-events: auto;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #ar-status {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 9;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(10, 12, 20, 0.72);
      color: #fff;
      font: 500 13px/1.2 system-ui, sans-serif;
      pointer-events: none;
      border: 1px solid rgba(255,255,255,0.2);
    }
    #loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(10, 12, 20, 0.92);
      color: #fff;
      font-family: system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <div id="ar-container"></div>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="ar-status">Initializing AR...</div>
  <div id="loading-overlay">
    <div id="loading-text">Loading WebAR Solar System... 0%</div>
  </div>

  <script>
    const unityCanvas = document.getElementById('unity-canvas');
    const origGetContext = unityCanvas.getContext.bind(unityCanvas);
    unityCanvas.getContext = function (type, attrs) {
      if (type === 'webgl' || type === 'webgl2') {
        attrs = Object.assign({}, attrs, {
          alpha: true,
          premultipliedAlpha: false,
          antialias: false,
          powerPreference: 'high-performance'
        });
      }
      return origGetContext(type, attrs);
    };
  </script>

  <script src="Build/SolarAR3.loader.js"></script>
  <script type="module">
    import { MindARThree } from 'mindar-image-three';

    const canvas = document.querySelector('#unity-canvas');
    const loadingOverlay = document.querySelector('#loading-overlay');
    const loadingText = document.querySelector('#loading-text');
    const statusBadge = document.querySelector('#ar-status');

    const RECEIVER = 'MindARManager';
    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

    const config = {
      dataUrl: "Build/SolarAR3.data.unityweb",
      frameworkUrl: "Build/SolarAR3.framework.js.unityweb",
      codeUrl: "Build/SolarAR3.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "SolarAR",
      productVersion: "0.1.0",
      // Lock 1.0 DPR on mobile so GPU shades 1x pixels instead of 4x-9x Retina pixels
      devicePixelRatio: isMobile ? 1 : Math.min(window.devicePixelRatio || 1, 1.5)
    };

    async function startAR(unityInstance) {
      const mindarThree = new MindARThree({
        container: document.querySelector('#ar-container'),
        imageTargetSrc: './targets.mind',
        maxTrack: 1,
        uiLoading: "no",
        uiScanning: "no",
        uiError: "no"
      });

      const { renderer, scene, camera } = mindarThree;
      // Keep MindAR's Three.js backing buffer tiny (1x1) since Unity renders all 3D visuals
      renderer.setPixelRatio(0.1);

      const anchor = mindarThree.addAnchor(0);
      let isTracking = false;
      let lastPose = '';
      let lastSendTime = 0;

      anchor.onTargetFound = () => {
        isTracking = true;
        statusBadge.textContent = 'Target Tracked!';
        statusBadge.style.borderColor = '#4ade80';
        unityInstance.SendMessage(RECEIVER, 'OnTargetFound', '');
      };

      anchor.onTargetLost = () => {
        isTracking = false;
        lastPose = '';
        statusBadge.textContent = 'Point camera at target image...';
        statusBadge.style.borderColor = 'rgba(255,255,255,0.2)';
        unityInstance.SendMessage(RECEIVER, 'OnTargetLost', '');
      };

      await mindarThree.start();
      statusBadge.textContent = 'Point camera at target image...';

      // Force synchronous reflow so the native <video> element paints immediately behind Unity
      const video = document.querySelector('#ar-container video');
      if (video) {
        video.style.display = 'none';
        void video.offsetHeight;
        video.style.display = 'block';
        video.play().catch(() => {});
      }

      renderer.setAnimationLoop((now) => {
        renderer.render(scene, camera);

        if (!isTracking || !anchor.group.visible) return;
        // Send pose updates at 25 Hz on mobile; Unity's poseSmoothTime (0.06s) interpolates smoothly
        if (isMobile && now - lastSendTime < 40) return;

        anchor.group.updateMatrixWorld();
        const e = anchor.group.matrixWorld.elements;
        let pose = '';
        for (let i = 0; i < 16; i++) pose += e[i].toFixed(4) + ',';
        pose += camera.fov.toFixed(2);
        if (pose === lastPose) return;

        lastPose = pose;
        lastSendTime = now;
        unityInstance.SendMessage(RECEIVER, 'UpdateTargetPose', pose);
      });
    }

    createUnityInstance(canvas, config, (progress) => {
      loadingText.textContent = `Loading WebAR Solar System... ${Math.round(progress * 100)}%`;
    }).then(async (unityInstance) => {
      loadingOverlay.style.display = 'none';
      await startAR(unityInstance);
    }).catch((err) => {
      loadingText.textContent = "Error: " + err;
    });
  </script>
</body>
</html>
