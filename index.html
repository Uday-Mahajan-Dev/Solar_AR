<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>SolarAR</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.153.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.153.0/examples/jsm/",
        "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
      }
    }
  </script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: #000;
    }
    /* Off-DOM-viewport container for MindAR's internal video/three elements */
    #ar-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      opacity: 0;
      pointer-events: none;
      z-index: 0;
    }
    /* 2D Canvas that paints the live camera frame reliably every RAF tick (bypasses Chromium video overlay stall) */
    #camera-feed {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      display: block;
      pointer-events: none;
    }
    /* Transparent Unity WebGL canvas on top */
    #unity-canvas {
      position: fixed;
      inset: 0;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 2;
      background: transparent !important;
      pointer-events: auto;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(10, 12, 20, 0.92);
      color: #fff;
      font-family: system-ui, sans-serif;
      text-align: center;
      padding: 0 16px;
    }
  </style>
</head>
<body>
  <div id="ar-container"></div>
  <canvas id="camera-feed"></canvas>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading-overlay">
    <div id="loading-text">Loading WebAR Solar System... 0%</div>
  </div>

  <script>
    const unityCanvas = document.getElementById('unity-canvas');
    const origGetContext = unityCanvas.getContext.bind(unityCanvas);
    unityCanvas.getContext = function (type, attrs) {
      if (type === 'webgl' || type === 'webgl2') {
        attrs = Object.assign({}, attrs, { alpha: true, premultipliedAlpha: false });
      }
      return origGetContext(type, attrs);
    };
  </script>

  <script src="Build/SolarAR3.loader.js"></script>
  <script type="module">
    import { MindARThree } from 'mindar-image-three';

    const canvas = document.querySelector('#unity-canvas');
    const camCanvas = document.querySelector('#camera-feed');
    const camCtx = camCanvas.getContext('2d');
    const loadingOverlay = document.querySelector('#loading-overlay');
    const loadingText = document.querySelector('#loading-text');

    const RECEIVER = 'MindARManager';
    const TAG = '[SolarAR]';
    const log = (...args) => console.log(TAG, ...args);
    const logError = (...args) => console.error(TAG, ...args);

    const config = {
      dataUrl: "Build/SolarAR3.data.unityweb",
      frameworkUrl: "Build/SolarAR3.framework.js.unityweb",
      codeUrl: "Build/SolarAR3.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "SolarAR",
      productVersion: "0.1.0",
    };

    function drawCameraCover(video) {
      if (!video || video.readyState < 2 || video.videoWidth === 0) return;
      const cw = window.innerWidth;
      const ch = window.innerHeight;
      if (camCanvas.width !== cw || camCanvas.height !== ch) {
        camCanvas.width = cw;
        camCanvas.height = ch;
      }
      const vw = video.videoWidth;
      const vh = video.videoHeight;
      const scale = Math.max(cw / vw, ch / vh);
      const dw = vw * scale;
      const dh = vh * scale;
      const dx = (cw - dw) * 0.5;
      const dy = (ch - dh) * 0.5;
      camCtx.drawImage(video, dx, dy, dw, dh);
    }

    async function startAR(unityInstance) {
      const mindarThree = new MindARThree({
        container: document.querySelector('#ar-container'),
        imageTargetSrc: './targets.mind',
        uiLoading: "no",
        uiScanning: "no",
        uiError: "no"
      });

      const { renderer, camera } = mindarThree;
      const anchor = mindarThree.addAnchor(0);
      let isTracking = false;
      let lastPose = '';

      anchor.onTargetFound = () => {
        isTracking = true;
        log('Target FOUND (index 0) -> Unity OnTargetFound');
        unityInstance.SendMessage(RECEIVER, 'OnTargetFound', '');
      };

      anchor.onTargetLost = () => {
        isTracking = false;
        lastPose = '';
        log('Target LOST (index 0) -> Unity OnTargetLost');
        unityInstance.SendMessage(RECEIVER, 'OnTargetLost', '');
      };

      log('Starting MindAR (camera permission + ./targets.mind)...');
      const t0 = performance.now();
      await mindarThree.start();

      const video = document.querySelector('#ar-container video');
      if (video) {
        log(`MindAR started in ${Math.round(performance.now() - t0)} ms; camera ${video.videoWidth}x${video.videoHeight}, three.js fov ${camera.fov.toFixed(2)}`);
      } else {
        logError('MindAR started but no <video> element was found in #ar-container');
      }

      renderer.setAnimationLoop(() => {
        // 1. Paint the live camera frame onto #camera-feed every frame (never stalls)
        drawCameraCover(video);

        // 2. Stream target pose to Unity when tracking
        if (!isTracking || !anchor.group.visible) return;
        anchor.group.updateMatrixWorld();
        const e = anchor.group.matrixWorld.elements;
        let pose = '';
        for (let i = 0; i < 16; i++) pose += e[i].toPrecision(7) + ',';
        pose += camera.fov.toPrecision(6);
        if (pose === lastPose) return;
        lastPose = pose;
        unityInstance.SendMessage(RECEIVER, 'UpdateTargetPose', pose);
      });
    }

    log('Loading Unity build...');
    createUnityInstance(canvas, config, (progress) => {
      loadingText.textContent = `Loading WebAR Solar System... ${Math.round(progress * 100)}%`;
    }).then(async (unityInstance) => {
      log('Unity loaded');
      loadingText.textContent = 'Starting camera...';
      try {
        await startAR(unityInstance);
        loadingOverlay.style.display = 'none';
      } catch (err) {
        const name = err && err.name ? err.name : 'Error';
        const hint = name === 'NotAllowedError' ? 'camera permission was denied'
                   : name === 'NotFoundError' ? 'no camera found'
                   : name === 'NotReadableError' ? 'camera is in use by another app'
                   : !window.isSecureContext ? 'page is not HTTPS'
                   : 'check that ./targets.mind is reachable';
        logError(`MindAR startup failed (${name}: ${err && err.message ? err.message : err}) - ${hint}`, err);
        loadingText.textContent = `Camera error: ${hint}. Reload to try again.`;
      }
    }).catch((err) => {
      logError('Unity failed to load', err);
      loadingText.textContent = "Error: " + err;
    });
  </script>
</body>
</html>
