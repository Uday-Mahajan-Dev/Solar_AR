<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SolarAR</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.153.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.153.0/examples/jsm/",
        "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
      }
    }
  </script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: #000;
    }
    #ar-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }
    #ar-container video {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }
    #ar-container canvas {
      display: none !important;
    }
    #camera-feed {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      display: block;
      pointer-events: none;
    }
    /* mix-blend-mode: screen eliminates Unity's opaque black clear color */
    #unity-canvas {
      position: fixed;
      inset: 0;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 2;
      background: transparent !important;
      mix-blend-mode: screen;
      pointer-events: auto;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #ar-status {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 9;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(10, 12, 20, 0.72);
      color: #fff;
      font: 500 13px/1.2 system-ui, sans-serif;
      pointer-events: none;
      border: 1px solid rgba(255,255,255,0.2);
    }
    #loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(10, 12, 20, 0.92);
      color: #fff;
      font-family: system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <div id="ar-container"></div>
  <canvas id="camera-feed"></canvas>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="ar-status">Initializing AR...</div>
  <div id="loading-overlay">
    <div id="loading-text">Loading WebAR Solar System... 0%</div>
  </div>

  <script src="Build/SolarAR3.loader.js"></script>
  <script type="module">
    import { MindARThree } from 'mindar-image-three';

    const canvas = document.querySelector('#unity-canvas');
    const camCanvas = document.querySelector('#camera-feed');
    const camCtx = camCanvas.getContext('2d', { alpha: false, desynchronized: true });
    const loadingOverlay = document.querySelector('#loading-overlay');
    const loadingText = document.querySelector('#loading-text');
    const statusBadge = document.querySelector('#ar-status');

    const RECEIVER = 'MindARManager';
    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

    const config = {
      dataUrl: "Build/SolarAR3.data.unityweb",
      frameworkUrl: "Build/SolarAR3.framework.js.unityweb",
      codeUrl: "Build/SolarAR3.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "SolarAR",
      productVersion: "0.1.0",
      // 1.0 DPR on mobile cuts fragment shader work by 4x-9x
      devicePixelRatio: isMobile ? 1 : Math.min(window.devicePixelRatio || 1, 1.5)
    };

    let cachedRect = { cw: 0, ch: 0, dx: 0, dy: 0, dw: 0, dh: 0, vw: 0, vh: 0 };

    function drawCameraCover(video) {
      if (!video || video.readyState < 2 || video.videoWidth === 0) return;
      // 0.5x scale on mobile copies 75% fewer pixels per frame while looking crisp on camera feed
      const scaleFactor = isMobile ? 0.5 : 1.0;
      const cw = Math.round(window.innerWidth * scaleFactor);
      const ch = Math.round(window.innerHeight * scaleFactor);
      const vw = video.videoWidth;
      const vh = video.videoHeight;

      if (cachedRect.cw !== cw || cachedRect.ch !== ch || cachedRect.vw !== vw || cachedRect.vh !== vh) {
        camCanvas.width = cw;
        camCanvas.height = ch;
        const scale = Math.max(cw / vw, ch / vh);
        const dw = vw * scale;
        const dh = vh * scale;
        cachedRect = { cw, ch, vw, vh, dw, dh, dx: (cw - dw) * 0.5, dy: (ch - dh) * 0.5 };
      }
      camCtx.drawImage(video, cachedRect.dx, cachedRect.dy, cachedRect.dw, cachedRect.dh);
    }

    async function startAR(unityInstance) {
      const mindarThree = new MindARThree({
        container: document.querySelector('#ar-container'),
        imageTargetSrc: './targets.mind',
        maxTrack: 1,
        uiLoading: "no",
        uiScanning: "no",
        uiError: "no"
      });

      const { renderer, camera } = mindarThree;
      renderer.setPixelRatio(0.1);

      const anchor = mindarThree.addAnchor(0);
      let isTracking = false;
      let lastPose = '';
      let lastSendTime = 0;

      anchor.onTargetFound = () => {
        isTracking = true;
        statusBadge.textContent = 'Target Tracked!';
        statusBadge.style.borderColor = '#4ade80';
        unityInstance.SendMessage(RECEIVER, 'OnTargetFound', '');
      };

      anchor.onTargetLost = () => {
        isTracking = false;
        lastPose = '';
        statusBadge.textContent = 'Point camera at target image...';
        statusBadge.style.borderColor = 'rgba(255,255,255,0.2)';
        unityInstance.SendMessage(RECEIVER, 'OnTargetLost', '');
      };

      await mindarThree.start();
      statusBadge.textContent = 'Point camera at target image...';
      const video = document.querySelector('#ar-container video');

      renderer.setAnimationLoop((now) => {
        // Notice: NO renderer.render(scene, camera) here — saves an entire WebGL pass on mobile
        drawCameraCover(video);

        if (!isTracking || !anchor.group.visible) return;
        // 25 Hz pose updates on mobile; Unity interpolates smoothly at 60fps
        if (isMobile && now - lastSendTime < 40) return;

        anchor.group.updateMatrixWorld();
        const e = anchor.group.matrixWorld.elements;
        let pose = '';
        for (let i = 0; i < 16; i++) pose += e[i].toFixed(4) + ',';
        pose += camera.fov.toFixed(2);
        if (pose === lastPose) return;

        lastPose = pose;
        lastSendTime = now;
        unityInstance.SendMessage(RECEIVER, 'UpdateTargetPose', pose);
      });
    }

    createUnityInstance(canvas, config, (progress) => {
      loadingText.textContent = `Loading WebAR Solar System... ${Math.round(progress * 100)}%`;
    }).then(async (unityInstance) => {
      loadingOverlay.style.display = 'none';
      await startAR(unityInstance);
    }).catch((err) => {
      loadingText.textContent = "Error: " + err;
    });
  </script>
</body>
</html>
